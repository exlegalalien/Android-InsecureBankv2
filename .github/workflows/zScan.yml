name: "Zimperium zScan"

on:
  workflow_run:
    workflows: ["Build Android (InsecureBankv2)"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Workflow run ID of 'Build Android (InsecureBankv2)' (leave blank to use latest)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  zscan:
    name: zScan
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read          # for actions/checkout to fetch code
      security-events: write  # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read           # required to download artifacts from another workflow run

    steps:
      - name: Download APK from Build Android workflow
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 8.0.2
        with:
          name: InsecureBankv2-debug-apk
          path: apk-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.build_run_id }}

      - name: Prepare APK for zScan
        run: |
          APK_PATH=$(find apk-artifact -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in downloaded artifact."
            exit 1
          fi
          cp "$APK_PATH" ./InsecureBankv2.apk
          ls -lh ./InsecureBankv2.apk

      - name: Run Zimperium zScan
        uses: zimperium/zscanmarketplace@8c1dff6166b6e25c59520480a766985f5eef3f8a # v1.6
        timeout-minutes: 60
        with:
          console_url: https://zc202.zimperium.com
          client_id: ${{ vars.ZSCAN_CLIENT_ID }}
          client_secret: ${{ secrets.ZSCAN_CLIENT_SECRET }}
          app_file: "InsecureBankv2.apk"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@2c6d525faa37685eb8a677b041e49725dd8d44cb # v4.39.5
        with:
          sarif_file: InsecureBankv2_zscan.sarif
          # Ensure SARIF results attach to the PR commit/branch when triggered via workflow_run
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          ref: ${{ github.event.workflow_run.head_branch && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.ref }}

